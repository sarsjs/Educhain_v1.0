runConfig:
  runtime: nodejs20
  env:
    # Variables públicas necesarias para la inicialización de Firebase en el cliente.
    # Cárgalas como variables o secretos administrados en App Hosting según el entorno.
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: "AIzaSyBY6aSJYqeX2QsucoagDOg8ZkAu06gEu7k"
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: "contacto-estudiantil.firebaseapp.com"
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: "contacto-estudiantil"
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: "contacto-estudiantil.firebasestorage.app"
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: "1054384089954"
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: "1:1054384089954:web:8898446e0c65214b039a3b"
    - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
      value: "G-109KM3955D"
    # Clave pública de reCAPTCHA v3 para App Check (opcional pero recomendada)
    - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
      value: "6LdWiCwsAAAAAP0tpLGcgpIl1V_8TlnDQj0xgJ0b"
    # Control para habilitar o deshabilitar App Check en el frontend; con Site Key se enciende automáticamente
    - variable: NEXT_PUBLIC_ENABLE_APPCHECK
      value: "true"
